// ======= PROCEDURAL SPRITE GENERATION =======

function makePlayerShip(scene) {
  const s = 64, c = document.createElement('canvas');
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  g.save();
  g.translate(s/2, s/2);

  // Main body — metallic blue hull
  const bodyGrad = g.createLinearGradient(-12, -24, 12, 24);
  bodyGrad.addColorStop(0, '#6699cc');
  bodyGrad.addColorStop(0.3, '#88bbee');
  bodyGrad.addColorStop(0.5, '#aaddff');
  bodyGrad.addColorStop(0.7, '#6699cc');
  bodyGrad.addColorStop(1, '#335577');

  g.fillStyle = bodyGrad;
  g.beginPath();
  g.moveTo(0, -28);    // nose
  g.lineTo(8, -18);
  g.lineTo(10, -8);
  g.lineTo(14, 0);
  g.lineTo(20, 8);     // wing tip right
  g.lineTo(18, 14);
  g.lineTo(10, 16);
  g.lineTo(6, 24);     // tail right
  g.lineTo(-6, 24);    // tail left
  g.lineTo(-10, 16);
  g.lineTo(-18, 14);
  g.lineTo(-20, 8);    // wing tip left
  g.lineTo(-14, 0);
  g.lineTo(-10, -8);
  g.lineTo(-8, -18);
  g.closePath();
  g.fill();

  // Panel lines
  g.strokeStyle = 'rgba(255,255,255,0.2)';
  g.lineWidth = 0.5;
  g.beginPath(); g.moveTo(-4, -20); g.lineTo(-4, 20); g.stroke();
  g.beginPath(); g.moveTo(4, -20); g.lineTo(4, 20); g.stroke();
  g.beginPath(); g.moveTo(-12, 4); g.lineTo(12, 4); g.stroke();

  // Cockpit — glowing cyan dome
  const cockpitGrad = g.createRadialGradient(0, -10, 1, 0, -10, 6);
  cockpitGrad.addColorStop(0, '#aaeeff');
  cockpitGrad.addColorStop(0.6, '#44aadd');
  cockpitGrad.addColorStop(1, '#226688');
  g.fillStyle = cockpitGrad;
  g.beginPath();
  g.ellipse(0, -10, 4, 7, 0, 0, Math.PI * 2);
  g.fill();

  // Wing accents
  g.fillStyle = '#ff6622';
  g.fillRect(-18, 10, 6, 2);
  g.fillRect(12, 10, 6, 2);

  // Engine nozzles
  g.fillStyle = '#334455';
  g.fillRect(-5, 22, 4, 4);
  g.fillRect(1, 22, 4, 4);

  g.restore();
  scene.textures.addCanvas('player', c);
}

function makeEnemyShip(scene, key, color1, color2, shape) {
  const s = 48, c = document.createElement('canvas');
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  g.translate(s/2, s/2);

  const grad = g.createLinearGradient(-10, -16, 10, 16);
  grad.addColorStop(0, color1);
  grad.addColorStop(0.5, color2);
  grad.addColorStop(1, color1);
  g.fillStyle = grad;

  if (shape === 'fighter') {
    g.beginPath();
    g.moveTo(0, 20); g.lineTo(14, -6); g.lineTo(20, -14);
    g.lineTo(8, -10); g.lineTo(0, -20);
    g.lineTo(-8, -10); g.lineTo(-20, -14); g.lineTo(-14, -6);
    g.closePath();
  } else if (shape === 'bomber') {
    g.beginPath();
    g.moveTo(0, 18); g.lineTo(16, 4); g.lineTo(18, -8);
    g.lineTo(10, -16); g.lineTo(-10, -16); g.lineTo(-18, -8);
    g.lineTo(-16, 4);
    g.closePath();
  } else {
    g.beginPath();
    g.moveTo(0, 18); g.lineTo(10, 8); g.lineTo(18, 0);
    g.lineTo(10, -14); g.lineTo(0, -18);
    g.lineTo(-10, -14); g.lineTo(-18, 0); g.lineTo(-10, 8);
    g.closePath();
  }
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.15)';
  g.lineWidth = 0.5;
  g.stroke();

  // Engine glow
  g.fillStyle = shape === 'bomber' ? '#ff4400' : '#ff0044';
  g.beginPath(); g.arc(0, -16, 3, 0, Math.PI*2); g.fill();

  scene.textures.addCanvas(key, c);
}

function makeBossShip(scene) {
  const s = 160, c = document.createElement('canvas');
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  g.translate(s/2, s/2);

  // Main hull
  const grad = g.createLinearGradient(-60, -40, 60, 40);
  grad.addColorStop(0, '#882222');
  grad.addColorStop(0.3, '#cc4444');
  grad.addColorStop(0.5, '#ff6666');
  grad.addColorStop(0.7, '#cc4444');
  grad.addColorStop(1, '#662222');
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(0, 50); g.lineTo(30, 30); g.lineTo(60, 10);
  g.lineTo(70, -10); g.lineTo(50, -30); g.lineTo(20, -40);
  g.lineTo(0, -50); g.lineTo(-20, -40); g.lineTo(-50, -30);
  g.lineTo(-70, -10); g.lineTo(-60, 10); g.lineTo(-30, 30);
  g.closePath();
  g.fill();

  // Panel lines
  g.strokeStyle = 'rgba(255,255,255,0.12)';
  g.lineWidth = 1;
  for (let i = -40; i <= 40; i += 20) {
    g.beginPath(); g.moveTo(i, -40); g.lineTo(i, 40); g.stroke();
  }

  // Cannons
  g.fillStyle = '#443333';
  g.fillRect(-55, -5, 12, 10);
  g.fillRect(43, -5, 12, 10);

  // Core — pulsing red
  const coreGrad = g.createRadialGradient(0, 0, 2, 0, 0, 18);
  coreGrad.addColorStop(0, '#ffaaaa');
  coreGrad.addColorStop(0.5, '#ff4444');
  coreGrad.addColorStop(1, '#880000');
  g.fillStyle = coreGrad;
  g.beginPath(); g.arc(0, 0, 18, 0, Math.PI*2); g.fill();

  // Engine banks
  g.fillStyle = '#ff6600';
  for (let x = -30; x <= 30; x += 15) {
    g.beginPath(); g.arc(x, -44, 4, 0, Math.PI*2); g.fill();
  }

  scene.textures.addCanvas('boss', c);
}

function makeMiniBoss(scene) {
  const s = 96, c = document.createElement('canvas');
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  g.translate(s/2, s/2);
  const grad = g.createLinearGradient(-30, -30, 30, 30);
  grad.addColorStop(0, '#886622');
  grad.addColorStop(0.3, '#ccaa44');
  grad.addColorStop(0.5, '#ffdd66');
  grad.addColorStop(0.7, '#ccaa44');
  grad.addColorStop(1, '#664411');
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(0, 36); g.lineTo(24, 18); g.lineTo(40, 0);
  g.lineTo(36, -20); g.lineTo(16, -34); g.lineTo(0, -38);
  g.lineTo(-16, -34); g.lineTo(-36, -20); g.lineTo(-40, 0);
  g.lineTo(-24, 18);
  g.closePath();
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.1)'; g.lineWidth = 0.8; g.stroke();
  // Cannons
  g.fillStyle = '#554422';
  g.fillRect(-36, -4, 10, 8); g.fillRect(26, -4, 10, 8);
  // Core
  const core = g.createRadialGradient(0, -4, 1, 0, -4, 12);
  core.addColorStop(0, '#ffffff'); core.addColorStop(0.4, '#ffaa00'); core.addColorStop(1, '#663300');
  g.fillStyle = core;
  g.beginPath(); g.arc(0, -4, 12, 0, Math.PI*2); g.fill();
  // Engines
  g.fillStyle = '#ff8800';
  g.beginPath(); g.arc(-14, -32, 4, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(14, -32, 4, 0, Math.PI*2); g.fill();
  scene.textures.addCanvas('miniboss', c);
}

// ======= PROCEDURAL MUSIC ENGINE =======
const StrikerMusic = {
  ctx: null, master: null, playing: false,
  nodes: [],

  start(audioCtx, masterGain) {
    if (this.playing) return;
    this.ctx = audioCtx; this.master = masterGain; this.playing = true;

    // Kick drum loop
    const kickLoop = () => {
      if (!this.playing) return;
      const c = this.ctx, t = c.currentTime;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(30, t + 0.12);
      const g = c.createGain();
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g).connect(this.master);
      o.start(t); o.stop(t + 0.15);
    };

    // Bass synth arpeggio
    const bassNotes = [55, 65.4, 73.4, 82.4, 73.4, 65.4]; // Am arpeggio
    let bassIdx = 0;
    const bassLoop = () => {
      if (!this.playing) return;
      const c = this.ctx, t = c.currentTime;
      const freq = bassNotes[bassIdx % bassNotes.length];
      bassIdx++;
      const o = c.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(freq, t);
      const f = c.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(400, t);
      f.frequency.exponentialRampToValueAtTime(150, t + 0.2);
      const g = c.createGain();
      g.gain.setValueAtTime(0.06, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.connect(f).connect(g).connect(this.master);
      o.start(t); o.stop(t + 0.25);
    };

    // Pad — sustained atmospheric chord
    const padFreqs = [220, 330, 440, 554]; // Am7 chord
    padFreqs.forEach(freq => {
      const c = this.ctx;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.value = freq;
      const g = c.createGain(); g.gain.value = 0.015;
      o.connect(g).connect(this.master);
      o.start();
      this.nodes.push({ o, g });
    });

    // Hi-hat pattern
    const hatLoop = () => {
      if (!this.playing) return;
      const c = this.ctx, t = c.currentTime;
      const noise = c.createBufferSource();
      const buf = c.createBuffer(1, c.sampleRate * 0.03, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      noise.buffer = buf;
      const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000;
      const g = c.createGain();
      g.gain.setValueAtTime(0.04, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
      noise.connect(f).connect(g).connect(this.master);
      noise.start(t); noise.stop(t + 0.03);
    };

    // Schedule loops
    const bpm = 130, beat = 60 / bpm;
    this._kickId = setInterval(kickLoop, beat * 2 * 1000);
    this._bassId = setInterval(bassLoop, beat * 1000);
    this._hatId = setInterval(hatLoop, beat * 0.5 * 1000);
    kickLoop(); bassLoop(); hatLoop();
  },

  stop() {
    this.playing = false;
    clearInterval(this._kickId);
    clearInterval(this._bassId);
    clearInterval(this._hatId);
    this.nodes.forEach(n => { try { n.o.stop(); } catch(e) {} });
    this.nodes = [];
  }
};

function makeBullet(scene, key, color, w, h) {
  const cw = w * 3, ch = h * 2;
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const g = c.getContext('2d');
  // Outer glow
  const glow = g.createRadialGradient(cw/2, ch/3, 0, cw/2, ch/3, cw/2);
  glow.addColorStop(0, color);
  glow.addColorStop(0.5, color + '66');
  glow.addColorStop(1, 'transparent');
  g.fillStyle = glow;
  g.fillRect(0, 0, cw, ch);
  // Bright core
  const core = g.createLinearGradient(0, 0, 0, ch);
  core.addColorStop(0, '#ffffff');
  core.addColorStop(0.2, '#ffffff');
  core.addColorStop(0.5, color);
  core.addColorStop(1, 'transparent');
  g.fillStyle = core;
  g.beginPath();
  g.ellipse(cw/2, ch/3, w/2 + 1, h/2 + 2, 0, 0, Math.PI*2);
  g.fill();
  // Trail streak
  const trail = g.createLinearGradient(0, ch/3, 0, ch);
  trail.addColorStop(0, color + 'aa');
  trail.addColorStop(1, 'transparent');
  g.fillStyle = trail;
  g.fillRect(cw/2 - 1.5, ch/3, 3, ch * 0.6);
  scene.textures.addCanvas(key, c);
}

function makeParticle(scene, key, color) {
  const s = 8, c = document.createElement('canvas');
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.3, color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.beginPath(); g.arc(s/2, s/2, s/2, 0, Math.PI*2); g.fill();
  scene.textures.addCanvas(key, c);
}

function makePowerup(scene, key, color) {
  const s = 28, c = document.createElement('canvas');
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s/2, s/2, 2, s/2, s/2, s/2);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.4, color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.beginPath(); g.arc(s/2, s/2, 12, 0, Math.PI*2); g.fill();
  g.strokeStyle = color;
  g.lineWidth = 1.5;
  g.beginPath(); g.arc(s/2, s/2, 10, 0, Math.PI*2); g.stroke();
  scene.textures.addCanvas(key, c);
}

function makeStarfield(scene) {
  // 3 parallax layers
  for (let layer = 0; layer < 3; layer++) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const count = [200, 80, 30][layer];
    const maxSize = [1.5, 2.5, 3.5][layer];
    for (let i = 0; i < count; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const r = Math.random() * maxSize + 0.5;
      const a = Math.random() * 0.4 + 0.15;
      // Color variation
      const colors = ['#ffffff', '#aaccff', '#ffddaa', '#ddddff'];
      g.fillStyle = colors[Math.floor(Math.random() * colors.length)];
      g.globalAlpha = a;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
    }
    // Add nebula wisps to the deepest layer
    if (layer === 0) {
      g.globalAlpha = 1;
      for (let i = 0; i < 5; i++) {
        const nx = Math.random() * W;
        const ny = Math.random() * H;
        const nr = Math.random() * 120 + 60;
        const ng = g.createRadialGradient(nx, ny, 0, nx, ny, nr);
        const hue = Math.random() * 60 + 240; // blue-purple range
        ng.addColorStop(0, `hsla(${hue}, 60%, 30%, 0.12)`);
        ng.addColorStop(1, 'transparent');
        g.fillStyle = ng;
        g.fillRect(nx - nr, ny - nr, nr*2, nr*2);
      }
    }
    scene.textures.addCanvas('stars' + layer, c);
  }
}

// ======= GAME SCENE =======

class GameScene extends Phaser.Scene {
  constructor() { super('game'); }

  create() {
    // Generate all textures
    makePlayerShip(this);
    makeEnemyShip(this, 'enemy_fighter', '#cc3333', '#ff6666', 'fighter');
    makeEnemyShip(this, 'enemy_bomber', '#33cc33', '#66ff66', 'bomber');
    makeEnemyShip(this, 'enemy_scout', '#cc33cc', '#ff66ff', 'scout');
    makeBossShip(this);
    makeMiniBoss(this);
    makeBullet(this, 'bullet_player', '#00ffcc', 8, 20);
    makeBullet(this, 'bullet_enemy', '#ff2222', 7, 16);
    makeBullet(this, 'bullet_boss', '#ff0066', 10, 18);
    makeParticle(this, 'particle_fire', '#ff8844');
    makeParticle(this, 'particle_blue', '#4488ff');
    makeParticle(this, 'particle_white', '#ffffff');
    makePowerup(this, 'powerup_spread', '#ffaa00');
    makePowerup(this, 'powerup_shield', '#44aaff');
    makePowerup(this, 'powerup_speed', '#44ff44');
    makePowerup(this, 'powerup_bomb', '#ff44ff');
    makeStarfield(this);

    // Background layers (parallax)
    this.bg0 = this.add.tileSprite(0, 0, W, H, 'stars0').setOrigin(0).setScrollFactor(0);
    this.bg1 = this.add.tileSprite(0, 0, W, H, 'stars1').setOrigin(0).setScrollFactor(0);
    this.bg2 = this.add.tileSprite(0, 0, W, H, 'stars2').setOrigin(0).setScrollFactor(0);

    // Player
    this.player = this.physics.add.sprite(W/2, H - 100, 'player');
    this.player.setCollideWorldBounds(true);
    this.player.setDepth(10);
    if (this.player.preFX) {
      this.player.preFX.addGlow(0x4488cc, 2, 0, false, 0.05, 16);
    }

    // Engine thrust particles
    this.thrustEmitter = this.add.particles(0, 0, 'particle_blue', {
      speed: { min: 40, max: 100 },
      angle: { min: 80, max: 100 },
      scale: { start: 0.8, end: 0 },
      lifespan: 300,
      frequency: 30,
      blendMode: 'ADD',
      follow: this.player,
      followOffset: { x: 0, y: 28 },
    });

    // Bullet groups
    this.playerBullets = this.physics.add.group({ maxSize: 60, classType: Phaser.Physics.Arcade.Sprite });
    this.enemyBullets = this.physics.add.group({ maxSize: 100, classType: Phaser.Physics.Arcade.Sprite });
    this.enemies = this.physics.add.group({ maxSize: 60 });
    this.powerups = this.physics.add.group({ maxSize: 10 });

    // State
    this.score = 0;
    this.combo = 1;
    this.comboTimer = 0;
    this.lives = 3;
    this.shieldActive = false;
    this.spreadLevel = 1;
    this.fireRate = 150;
    this.lastFire = 0;
    this.waveIndex = 0;
    this.waveTimer = 0;
    this.waveDelay = 2000;
    this.bossAlive = false;
    this.boss = null;
    this.bossPhase = 0;
    this.bossHP = 0;
    this.gameOver = false;
    this.invincible = false;
    this.currentEnv = 0;
    this.envOverlay = this.add.rectangle(W/2, H/2, W, H, 0x000000, 0).setDepth(1).setScrollFactor(0);

    // Touch / drag controls
    this.input.on('pointermove', (p) => {
      if (this.gameOver) return;
      this.player.x = Phaser.Math.Clamp(p.x, 20, W - 20);
      this.player.y = Phaser.Math.Clamp(p.y, 40, H - 40);
    });

    // Collisions
    this.physics.add.overlap(this.playerBullets, this.enemies, this.hitEnemy, null, this);
    this.physics.add.overlap(this.player, this.enemies, this.hitPlayer, null, this);
    this.physics.add.overlap(this.player, this.enemyBullets, this.hitPlayer, null, this);
    this.physics.add.overlap(this.player, this.powerups, this.collectPowerup, null, this);

    // HUD
    this.scoreText = this.add.text(W/2, 20, '0', {
      fontFamily: 'system-ui, sans-serif', fontSize: '24px', fontStyle: 'bold',
      color: '#ffffff', align: 'center',
    }).setOrigin(0.5, 0).setDepth(20);

    this.livesText = this.add.text(16, 20, '', {
      fontFamily: 'system-ui, sans-serif', fontSize: '16px', color: '#ff4444',
    }).setDepth(20);

    this.comboText = this.add.text(W - 16, 48, '', {
      fontFamily: 'system-ui, sans-serif', fontSize: '14px', fontStyle: 'bold',
      color: '#ffdd00', align: 'right',
    }).setOrigin(1, 0).setDepth(20);

    this.waveText = this.add.text(W/2, H/2 - 40, '', {
      fontFamily: 'system-ui, sans-serif', fontSize: '20px', fontStyle: 'bold',
      color: '#88ccff', align: 'center',
    }).setOrigin(0.5).setDepth(20).setAlpha(0);

    this.updateHUD();

    // Restart button (top-right corner)
    this.restartBtn = this.add.text(W - 16, 20, '↺', {
      fontFamily: 'system-ui', fontSize: '22px', color: '#556677',
      padding: { x: 6, y: 2 },
    }).setOrigin(1, 0).setDepth(25).setInteractive({ useHandCursor: true });
    this.restartBtn.on('pointerdown', (p) => {
      p.event.stopPropagation();
      StrikerMusic.stop();
      this.scene.start('title');
    });
    this.restartBtn.on('pointerover', () => this.restartBtn.setColor('#88aacc'));
    this.restartBtn.on('pointerout', () => this.restartBtn.setColor('#556677'));

    // Home button (next to restart)
    this.homeBtn = this.add.text(W - 50, 20, '⌂', {
      fontFamily: 'system-ui', fontSize: '22px', color: '#556677',
      padding: { x: 6, y: 2 },
    }).setOrigin(1, 0).setDepth(25).setInteractive({ useHandCursor: true });
    this.homeBtn.on('pointerdown', (p) => {
      p.event.stopPropagation();
      StrikerMusic.stop();
      window.location.href = '../../index.html';
    });
    this.homeBtn.on('pointerover', () => this.homeBtn.setColor('#88aacc'));
    this.homeBtn.on('pointerout', () => this.homeBtn.setColor('#556677'));

    // Camera FX
    if (this.cameras.main.postFX) {
      this.cameras.main.postFX.addVignette(0.5, 0.5, 0.9);
    }

    // Audio init + music (continue from title if already playing)
    if (window.Sound) {
      Sound.init();
      if (!StrikerMusic.playing) StrikerMusic.start(Sound.ctx, Sound.master);
    }

    // Environment name flash
    this.envText = this.add.text(W/2, H/2 + 30, '', {
      fontFamily: 'system-ui', fontSize: '14px', letterSpacing: 4, color: '#667788',
    }).setOrigin(0.5).setDepth(20).setAlpha(0);
  }

  update(time, delta) {
    if (this.gameOver) return;

    // Parallax scroll
    this.bg0.tilePositionY -= 0.3;
    this.bg1.tilePositionY -= 0.8;
    this.bg2.tilePositionY -= 1.5;

    // Auto-fire
    if (time > this.lastFire + this.fireRate) {
      this.firePlayerBullet(time);
      this.lastFire = time;
    }

    // Combo decay
    if (this.combo > 1) {
      this.comboTimer -= delta;
      if (this.comboTimer <= 0) { this.combo = 1; this.updateHUD(); }
    }

    // Wave spawning
    this.waveTimer -= delta;
    if (this.waveTimer <= 0 && !this.bossAlive && this.enemies.countActive() === 0) {
      this.spawnWave();
    }

    // Enemy behaviour
    this.enemies.children.each(e => {
      if (!e.active) return;
      if (e.getData('type') === 'boss') {
        this.updateBoss(e, time);
        return;
      }
      if (e.getData('type') === 'miniboss') {
        this.updateMiniBoss(e, time);
        return;
      }
      // Move downward
      if (e.y > H + 40) { e.destroy(); return; }
      // Some enemies shoot
      if (e.getData('canShoot') && time > (e.getData('lastShot') || 0) + 1200) {
        this.fireEnemyBullet(e);
        e.setData('lastShot', time);
      }
    });

    // Clean up off-screen bullets
    this.playerBullets.children.each(b => { if (b.active && b.y < -20) b.destroy(); });
    this.enemyBullets.children.each(b => { if (b.active && (b.y > H + 20 || b.y < -20)) b.destroy(); });
  }

  firePlayerBullet(time) {
    const fire = (offsetX, angle) => {
      const b = this.playerBullets.create(this.player.x + offsetX, this.player.y - 20, 'bullet_player');
      if (!b) return;
      b.setDepth(5);
      b.body.setSize(4, 12);
      const rad = Phaser.Math.DegToRad(angle || -90);
      b.setVelocity(Math.cos(rad) * 500, Math.sin(rad) * 500);
      if (b.preFX) b.preFX.addGlow(0xffdd00, 2, 0, false, 0.1, 8);
    };

    fire(0, -90);
    if (this.spreadLevel >= 2) { fire(-8, -95); fire(8, -85); }
    if (this.spreadLevel >= 3) { fire(-14, -100); fire(14, -80); }

    // Laser SFX — punchy "pow" with resonance
    if (window.Sound && Sound.ctx) {
      const c = Sound.ctx, t = c.currentTime;
      // Tone sweep
      const o = c.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(1200 + Math.random() * 300, t);
      o.frequency.exponentialRampToValueAtTime(300, t + 0.08);
      // Resonant filter for "pew" character
      const f = c.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.setValueAtTime(1800, t); f.Q.value = 5;
      f.frequency.exponentialRampToValueAtTime(600, t + 0.08);
      const g = c.createGain();
      g.gain.setValueAtTime(0.07, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      o.connect(f).connect(g).connect(Sound.master);
      o.start(t); o.stop(t + 0.1);
      // Click transient for punch
      const click = c.createOscillator(); click.type = 'sine';
      click.frequency.setValueAtTime(3000, t);
      const cg = c.createGain();
      cg.gain.setValueAtTime(0.05, t);
      cg.gain.exponentialRampToValueAtTime(0.001, t + 0.015);
      click.connect(cg).connect(Sound.master);
      click.start(t); click.stop(t + 0.015);
    }
  }

  fireEnemyBullet(enemy) {
    const b = this.enemyBullets.create(enemy.x, enemy.y + 16, 'bullet_enemy');
    if (!b) return;
    b.setDepth(5);
    // Aim at player
    const angle = Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player.y);
    b.setVelocity(Math.cos(angle) * 180, Math.sin(angle) * 180);
  }

  spawnWave() {
    if (this.waveIndex >= WAVES.length) {
      // Victory!
      this.showVictory();
      return;
    }

    const wave = WAVES[this.waveIndex];
    this.waveIndex++;
    this.waveDelay = 3000;
    this.waveTimer = this.waveDelay;

    // Show wave text
    const actNum = this.waveIndex <= 5 ? 1 : this.waveIndex <= 10 ? 2 : 3;
    const label = wave.boss ? 'WARNING: BOSS INCOMING' : `WAVE ${this.waveIndex}`;
    this.waveText.setText(label);
    this.waveText.setColor(wave.boss ? '#ff4444' : '#88ccff');
    this.tweens.add({
      targets: this.waveText, alpha: 1, duration: 300,
      yoyo: true, hold: 800,
    });

    // Environment transition
    const newEnv = this.waveIndex <= 6 ? 0 : this.waveIndex <= 12 ? 1 : 2;
    if (newEnv !== this.currentEnv) {
      this.currentEnv = newEnv;
      const env = ENVS[newEnv];
      // Tint overlay for atmosphere
      this.tweens.add({
        targets: this.envOverlay,
        fillColor: env.bg,
        fillAlpha: 0.3,
        duration: 2000,
      });
      // Flash environment name
      this.envText.setText(env.name);
      this.tweens.add({ targets: this.envText, alpha: 0.8, duration: 500, yoyo: true, hold: 1000 });
    }

    if (wave.boss) {
      this.time.delayedCall(1500, () => this.spawnBoss());
      return;
    }

    if (wave.miniBoss) {
      this.time.delayedCall(1000, () => this.spawnMiniBoss());
      return;
    }

    let totalDelay = 0;
    wave.enemies.forEach(group => {
      for (let i = 0; i < group.count; i++) {
        this.time.delayedCall(totalDelay + i * group.delay, () => {
          this.spawnEnemy(group.type, group.formation, i, group.count);
        });
      }
      totalDelay += group.count * group.delay + 200;
    });
  }

  spawnEnemy(type, formation, index, total) {
    const texKey = 'enemy_' + type;
    let x, y = -40;

    if (formation === 'v') {
      const center = W / 2;
      const offset = (index - total / 2) * 40;
      x = center + offset;
      y = -40 - Math.abs(offset) * 0.5;
    } else if (formation === 'line') {
      x = (W / (total + 1)) * (index + 1);
    } else { // scatter
      x = Phaser.Math.Between(40, W - 40);
      y = Phaser.Math.Between(-80, -30);
    }

    const e = this.enemies.create(x, y, texKey);
    if (!e) return;
    e.setDepth(5);
    e.setData('type', type);
    e.setData('hp', type === 'bomber' ? 3 : type === 'scout' ? 1 : 2);
    e.setData('canShoot', type !== 'scout');
    e.setData('score', type === 'bomber' ? 150 : type === 'scout' ? 50 : 100);

    const speed = type === 'scout' ? 200 : type === 'bomber' ? 80 : 120;
    e.setVelocityY(speed);

    if (type === 'scout') {
      // Scouts weave
      this.tweens.add({
        targets: e, x: e.x + Phaser.Math.Between(-60, 60),
        duration: 1000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut',
      });
    }
  }

  spawnMiniBoss() {
    this.bossAlive = true;
    // Clear stragglers
    this.enemies.children.each(e => {
      if (e.active && e.getData('type') !== 'boss' && e.getData('type') !== 'miniboss') e.destroy();
    });
    const mb = this.enemies.create(W/2, -60, 'miniboss');
    if (!mb) { this.bossAlive = false; return; }
    mb.setDepth(8);
    mb.setData('type', 'miniboss');
    mb.setData('hp', 20);
    mb.setData('score', 2000);
    mb.setData('canShoot', false);
    mb.setData('spiralAngle', 0);
    this.tweens.add({ targets: mb, y: 140, duration: 1500, ease: 'Sine.easeOut' });
    if (mb.preFX) mb.preFX.addGlow(0xffaa00, 3, 0, false, 0.06, 16);

    // Mini-boss HP bar
    this.miniBossBar = this.add.graphics().setDepth(20);
    this.miniBossRef = mb;
    this.miniBossMaxHP = 20;
  }

  updateMiniBoss(mb, time) {
    if (!mb.active) return;
    mb.x = W/2 + Math.sin(time * 0.0015) * 120;

    // Spiral bullet pattern
    if (time > (mb.getData('lastShot') || 0) + 200) {
      mb.setData('lastShot', time);
      let angle = mb.getData('spiralAngle');
      for (let i = 0; i < 2; i++) {
        const b = this.enemyBullets.create(mb.x, mb.y + 20, 'bullet_boss');
        if (b) {
          const rad = Phaser.Math.DegToRad(angle + i * 180);
          b.setVelocity(Math.cos(rad) * 130, Math.sin(rad) * 130);
          b.setDepth(5);
        }
      }
      mb.setData('spiralAngle', angle + 15);
    }

    // HP bar
    if (this.miniBossBar) {
      this.miniBossBar.clear();
      const hp = mb.getData('hp');
      const pct = hp / this.miniBossMaxHP;
      this.miniBossBar.fillStyle(0x222222, 0.8);
      this.miniBossBar.fillRect(80, 60, W - 160, 6);
      this.miniBossBar.fillStyle(0xffaa00, 1);
      this.miniBossBar.fillRect(80, 60, (W - 160) * pct, 6);
    }
  }

  spawnBoss() {
    this.bossAlive = true;
    this.bossHP = 50;
    this.bossPhase = 1;

    // Clear any remaining enemies to make room in the pool
    this.enemies.children.each(e => {
      if (e.active && e.getData('type') !== 'boss' && e.getData('type') !== 'miniboss') {
        e.destroy();
      }
    });

    this.boss = this.enemies.create(W/2, -100, 'boss');
    if (!this.boss) { this.bossAlive = false; return; }
    this.boss.setDepth(8);
    this.boss.setData('type', 'boss');
    this.boss.setData('hp', this.bossHP);
    this.boss.setData('score', 5000);
    this.boss.setData('canShoot', false);

    // Entrance
    this.tweens.add({
      targets: this.boss, y: 120, duration: 2000, ease: 'Sine.easeOut',
    });

    if (this.boss.preFX) {
      this.boss.preFX.addGlow(0xff2200, 4, 0, false, 0.08, 24);
    }

    // Boss HP bar
    this.bossBar = this.add.graphics().setDepth(20);
  }

  updateBoss(boss, time) {
    if (!boss.active) return;

    // Phase movement
    if (this.bossPhase === 1) {
      boss.x = W/2 + Math.sin(time * 0.001) * 100;
    } else if (this.bossPhase === 2) {
      boss.x = W/2 + Math.sin(time * 0.002) * 140;
      boss.y = 120 + Math.sin(time * 0.0015) * 30;
    } else {
      boss.x = W/2 + Math.sin(time * 0.003) * 160;
      boss.y = 100 + Math.sin(time * 0.002) * 50;
    }

    // Boss shooting
    const fireInterval = this.bossPhase === 1 ? 800 : this.bossPhase === 2 ? 500 : 300;
    if (time > (boss.getData('lastShot') || 0) + fireInterval) {
      boss.setData('lastShot', time);
      if (this.bossPhase >= 2) {
        // Radial burst
        for (let a = 0; a < 360; a += 45) {
          const b = this.enemyBullets.create(boss.x, boss.y + 30, 'bullet_boss');
          if (b) {
            const rad = Phaser.Math.DegToRad(a);
            b.setVelocity(Math.cos(rad) * 140, Math.sin(rad) * 140);
            b.setDepth(5);
          }
        }
      } else {
        // Aimed shots
        for (let i = -1; i <= 1; i++) {
          const b = this.enemyBullets.create(boss.x + i * 40, boss.y + 40, 'bullet_boss');
          if (b) {
            const angle = Phaser.Math.Angle.Between(boss.x, boss.y, this.player.x, this.player.y);
            b.setVelocity(Math.cos(angle + i * 0.15) * 160, Math.sin(angle + i * 0.15) * 160);
            b.setDepth(5);
          }
        }
      }
    }

    // HP bar
    if (this.bossBar) {
      this.bossBar.clear();
      const hp = boss.getData('hp');
      const pct = hp / this.bossHP;
      this.bossBar.fillStyle(0x222222, 0.8);
      this.bossBar.fillRect(40, 60, W - 80, 8);
      this.bossBar.fillStyle(pct > 0.5 ? 0xff4444 : pct > 0.25 ? 0xff8800 : 0xff0000, 1);
      this.bossBar.fillRect(40, 60, (W - 80) * pct, 8);
    }
  }

  hitEnemy(bullet, enemy) {
    bullet.destroy();
    let hp = enemy.getData('hp') - 1;
    enemy.setData('hp', hp);

    // Flash white
    enemy.setTint(0xffffff);
    this.time.delayedCall(50, () => { if (enemy.active) enemy.clearTint(); });

    if (hp <= 0) {
      const pts = enemy.getData('score') * this.combo;
      this.score += pts;
      this.combo = Math.min(this.combo + 1, 10);
      this.comboTimer = 2000;

      // Score popup
      const popup = this.add.text(enemy.x, enemy.y, `+${pts}`, {
        fontFamily: 'system-ui', fontSize: '14px', fontStyle: 'bold',
        color: this.combo > 3 ? '#ffdd00' : '#ffffff',
      }).setOrigin(0.5).setDepth(20);
      this.tweens.add({
        targets: popup, y: enemy.y - 40, alpha: 0, duration: 600,
        onComplete: () => popup.destroy(),
      });

      // Explosion
      this.spawnExplosion(enemy.x, enemy.y, enemy.getData('type') === 'boss' ? 40 : 15);

      // Screen shake
      const intensity = enemy.getData('type') === 'boss' ? 0.012 : 0.004;
      this.cameras.main.shake(100, intensity);

      // Mini-boss death
      if (enemy.getData('type') === 'miniboss') {
        this.bossAlive = false;
        if (this.miniBossBar) { this.miniBossBar.destroy(); this.miniBossBar = null; }
        this.miniBossRef = null;
      }

      // Boss death
      if (enemy.getData('type') === 'boss') {
        this.bossAlive = false;
        if (this.bossBar) { this.bossBar.destroy(); this.bossBar = null; }
        // Big explosion sequence
        for (let i = 0; i < 8; i++) {
          this.time.delayedCall(i * 200, () => {
            this.spawnExplosion(
              enemy.x + Phaser.Math.Between(-50, 50),
              enemy.y + Phaser.Math.Between(-40, 40), 25
            );
            this.cameras.main.shake(150, 0.008);
          });
        }
      }

      // Power-up drop (20% chance)
      if (Math.random() < 0.2 && enemy.getData('type') !== 'boss') {
        const types = ['powerup_spread', 'powerup_shield', 'powerup_speed', 'powerup_bomb'];
        const ptype = types[Math.floor(Math.random() * types.length)];
        const pu = this.powerups.create(enemy.x, enemy.y, ptype);
        if (pu) {
          pu.setDepth(6);
          pu.setVelocityY(60);
          pu.setData('ptype', ptype);
          if (pu.preFX) pu.preFX.addGlow(0xffffff, 2, 0, false, 0.1, 12);
        }
      }

      enemy.destroy();

      // Boss phase check
      if (enemy === this.boss) return;
    } else {
      // Boss phase transitions
      if (enemy.getData('type') === 'boss') {
        const pct = hp / this.bossHP;
        if (pct < 0.6 && this.bossPhase === 1) {
          this.bossPhase = 2;
          this.cameras.main.shake(200, 0.008);
          this.waveText.setText('PHASE 2'); this.waveText.setColor('#ff8800');
          this.tweens.add({ targets: this.waveText, alpha: 1, duration: 200, yoyo: true, hold: 500 });
        } else if (pct < 0.3 && this.bossPhase === 2) {
          this.bossPhase = 3;
          this.cameras.main.shake(300, 0.01);
          this.waveText.setText('FINAL PHASE'); this.waveText.setColor('#ff0000');
          this.tweens.add({ targets: this.waveText, alpha: 1, duration: 200, yoyo: true, hold: 500 });
        }
      }
    }

    this.updateHUD();

    // Explosion SFX — layered bass thump + filtered noise + crackle
    if (window.Sound && Sound.ctx) {
      const c = Sound.ctx, t = c.currentTime;
      const isBoss = enemy.getData('type') === 'boss' || enemy.getData('type') === 'miniboss';
      const vol = isBoss ? 1.5 : 1;
      const dur = isBoss ? 0.5 : 0.3;
      // Bass thump
      const bass = c.createOscillator(); bass.type = 'sine';
      bass.frequency.setValueAtTime(isBoss ? 80 : 120, t);
      bass.frequency.exponentialRampToValueAtTime(20, t + dur);
      const bg = c.createGain();
      bg.gain.setValueAtTime(0.15 * vol, t);
      bg.gain.exponentialRampToValueAtTime(0.001, t + dur);
      bass.connect(bg).connect(Sound.master);
      bass.start(t); bass.stop(t + dur);
      // Filtered noise burst
      const noise = c.createBufferSource();
      noise.buffer = Sound._noiseBuf;
      const nf = c.createBiquadFilter(); nf.type = 'bandpass';
      nf.frequency.setValueAtTime(3000, t);
      nf.frequency.exponentialRampToValueAtTime(200, t + dur * 0.8);
      nf.Q.value = 1;
      const ng = c.createGain();
      ng.gain.setValueAtTime(0.12 * vol, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.7);
      noise.connect(nf).connect(ng).connect(Sound.master);
      noise.start(t); noise.stop(t + dur);
      // High crackle
      const crackle = c.createBufferSource();
      crackle.buffer = Sound._noiseBuf;
      const cf = c.createBiquadFilter(); cf.type = 'highpass'; cf.frequency.value = 6000;
      const cg = c.createGain();
      cg.gain.setValueAtTime(0.04 * vol, t);
      cg.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      crackle.connect(cf).connect(cg).connect(Sound.master);
      crackle.start(t); crackle.stop(t + 0.12);
    }
  }

  hitPlayer(player, obj) {
    if (this.invincible || this.gameOver) return;
    if (this.shieldActive) {
      this.shieldActive = false;
      obj.destroy();
      this.cameras.main.shake(100, 0.005);
      return;
    }

    obj.destroy();
    this.lives--;
    this.combo = 1;
    this.spreadLevel = 1;

    if (this.lives <= 0) {
      this.doGameOver();
      return;
    }

    // Invincibility frames
    this.invincible = true;
    this.tweens.add({
      targets: player, alpha: 0.3, duration: 100, yoyo: true, repeat: 8,
      onComplete: () => { player.setAlpha(1); this.invincible = false; },
    });

    this.cameras.main.shake(200, 0.008);
    this.spawnExplosion(player.x, player.y, 10);
    this.updateHUD();
  }

  collectPowerup(player, pu) {
    const type = pu.getData('ptype');
    pu.destroy();

    if (type === 'powerup_spread') {
      this.spreadLevel = Math.min(this.spreadLevel + 1, 3);
    } else if (type === 'powerup_shield') {
      this.shieldActive = true;
    } else if (type === 'powerup_speed') {
      this.fireRate = Math.max(this.fireRate - 30, 60);
    } else if (type === 'powerup_bomb') {
      // Screen clear
      this.enemies.children.each(e => {
        if (e.active && e.getData('type') !== 'boss') {
          this.score += e.getData('score');
          this.spawnExplosion(e.x, e.y, 10);
          e.destroy();
        }
      });
      this.enemyBullets.clear(true, true);
      this.cameras.main.shake(300, 0.01);
      // Flash
      this.cameras.main.flash(200, 255, 255, 255, false, null, this);
    }

    // Pickup SFX
    if (window.Sound && Sound.ctx) {
      const c = Sound.ctx, t = c.currentTime;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(600, t);
      o.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
      const g = c.createGain();
      g.gain.setValueAtTime(0.1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g).connect(Sound.master);
      o.start(t); o.stop(t + 0.15);
    }

    this.updateHUD();
  }

  spawnExplosion(x, y, count) {
    this.add.particles(x, y, 'particle_fire', {
      speed: { min: 50, max: 200 },
      scale: { start: 1.2, end: 0 },
      lifespan: { min: 200, max: 500 },
      quantity: count,
      blendMode: 'ADD',
      emitting: false,
    }).explode();

    this.add.particles(x, y, 'particle_white', {
      speed: { min: 30, max: 120 },
      scale: { start: 0.6, end: 0 },
      lifespan: { min: 100, max: 300 },
      quantity: Math.floor(count / 2),
      blendMode: 'ADD',
      emitting: false,
    }).explode();
  }

  updateHUD() {
    this.scoreText.setText(this.score.toLocaleString());
    this.livesText.setText('♥'.repeat(this.lives));
    this.comboText.setText(this.combo > 1 ? `×${this.combo}` : '');
  }

  showVictory() {
    this.gameOver = true;
    StrikerMusic.stop();
    const t1 = this.add.text(W/2, H/2 - 60, 'VICTORY', {
      fontFamily: 'system-ui', fontSize: '48px', fontStyle: 'bold', color: '#ffdd00',
    }).setOrigin(0.5).setDepth(30);

    const t2 = this.add.text(W/2, H/2, `SCORE: ${this.score.toLocaleString()}`, {
      fontFamily: 'system-ui', fontSize: '24px', color: '#ffffff',
    }).setOrigin(0.5).setDepth(30);

    const t3 = this.add.text(W/2, H/2 + 60, 'TAP TO PLAY AGAIN', {
      fontFamily: 'system-ui', fontSize: '16px', color: '#88ccff',
    }).setOrigin(0.5).setDepth(30);

    this.tweens.add({ targets: t3, alpha: 0.3, duration: 600, yoyo: true, repeat: -1 });

    if (window.Leaderboard) {
      Leaderboard.submit('neonStriker.leaderboard.v1', this.score, false);
    }

    this.input.once('pointerdown', () => this.scene.restart());
  }

  doGameOver() {
    this.gameOver = true;
    StrikerMusic.stop();
    this.player.setVisible(false);
    this.thrustEmitter.stop();

    this.spawnExplosion(this.player.x, this.player.y, 30);
    this.cameras.main.shake(400, 0.015);

    this.time.delayedCall(800, () => {
      const t1 = this.add.text(W/2, H/2 - 60, 'GAME OVER', {
        fontFamily: 'system-ui', fontSize: '42px', fontStyle: 'bold', color: '#ff4444',
      }).setOrigin(0.5).setDepth(30);

      const t2 = this.add.text(W/2, H/2, `SCORE: ${this.score.toLocaleString()}`, {
        fontFamily: 'system-ui', fontSize: '24px', color: '#ffffff',
      }).setOrigin(0.5).setDepth(30);

      const t3 = this.add.text(W/2, H/2 + 50, `WAVE: ${this.waveIndex} / ${WAVES.length}`, {
        fontFamily: 'system-ui', fontSize: '16px', color: '#88ccff',
      }).setOrigin(0.5).setDepth(30);

      const t4 = this.add.text(W/2, H/2 + 90, 'TAP TO RETRY', {
        fontFamily: 'system-ui', fontSize: '16px', color: '#aaaaaa',
      }).setOrigin(0.5).setDepth(30);

      this.tweens.add({ targets: t4, alpha: 0.3, duration: 600, yoyo: true, repeat: -1 });

      if (window.Leaderboard) {
        Leaderboard.submit('neonStriker.leaderboard.v1', this.score, false);
      }

      this.input.once('pointerdown', () => this.scene.restart());
    });
  }
}

// ======= TITLE SCENE =======

class TitleScene extends Phaser.Scene {
  constructor() { super('title'); }

  create() {
    makeStarfield(this);
    this.bg = this.add.tileSprite(0, 0, W, H, 'stars0').setOrigin(0);

    this.add.text(W/2, H/3 - 20, 'STRIKER', {
      fontFamily: 'system-ui, sans-serif', fontSize: '56px', fontStyle: 'bold',
      color: '#88ccff',
    }).setOrigin(0.5);

    this.add.text(W/2, H/3 + 30, 'A SPACE SHOOTER', {
      fontFamily: 'system-ui', fontSize: '14px', letterSpacing: 4,
      color: '#6688aa',
    }).setOrigin(0.5);

    const play = this.add.text(W/2, H/2 + 40, '▶  PLAY', {
      fontFamily: 'system-ui', fontSize: '22px', fontStyle: 'bold',
      color: '#ffdd00', padding: { x: 30, y: 12 },
      backgroundColor: 'rgba(255,221,0,0.1)',
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });

    // Start music on first touch anywhere (needed for iOS audio unlock)
    this.input.once('pointerdown', () => {
      if (window.Sound) {
        Sound.init();
        if (!StrikerMusic.playing) StrikerMusic.start(Sound.ctx, Sound.master);
      }
    });

    play.on('pointerdown', () => {
      if (window.Sound) Sound.init();
      // Music continues from title into game — don't restart if already playing
      if (!StrikerMusic.playing && Sound.ctx) StrikerMusic.start(Sound.ctx, Sound.master);
      this.scene.start('game');
    });

    this.tweens.add({ targets: play, alpha: 0.6, duration: 800, yoyo: true, repeat: -1 });

    // Best score
    if (window.Leaderboard) {
      const best = Leaderboard.get('neonStriker.leaderboard.v1');
      if (best && best.length > 0) {
        this.add.text(W/2, H/2 + 100, `BEST: ${best[0].score.toLocaleString()}`, {
          fontFamily: 'system-ui', fontSize: '14px', color: '#667788',
        }).setOrigin(0.5);
      }
    }

    this.add.text(W/2, H - 60, 'Drag to move · Auto-fire · Collect power-ups', {
      fontFamily: 'system-ui', fontSize: '12px', color: '#445566', align: 'center',
    }).setOrigin(0.5);
  }

  update() {
    this.bg.tilePositionY -= 0.5;
  }
}

// ======= LAUNCH =======

new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  parent: 'game',
  backgroundColor: CLR.bg,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
  },
  physics: {
    default: 'arcade',
    arcade: { debug: false },
  },
  scene: [TitleScene, GameScene],
});

})();
</script>
